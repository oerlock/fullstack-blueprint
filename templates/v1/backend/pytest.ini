[pytest]

# 默认参数说明：
# -ra               显示失败、跳过、xfail 等摘要
# -q                减少噪音输出
# --strict-markers  未注册 marker 直接报错
# --maxfail=1       发生首个失败后停止
# --import-mode=importlib  按完整包名导入测试模块，允许不同包使用同名测试文件
addopts = -ra -q --strict-markers --maxfail=1 --import-mode=importlib

# importlib 导入模式不会自动修改 sys.path，显式加入项目根目录
pythonpath = .

# 自动管理 asyncio event loop
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 仅在 tests 目录中发现测试
# 避免扫描整个仓库，提升发现速度
testpaths =
    tests

# 测试文件命名规则
python_files =
    test_*.py

# 注册允许使用的 marker
markers =
    slow: 运行时间较长的测试
    api: API 接口测试
    integration: 集成测试
    requires_postgres: 需要真实 PostgreSQL 的集成测试（历史保留）
    requires_database: 需要真实数据库（MySQL）的集成测试
    requires_redis: 需要真实 Redis 的集成测试
