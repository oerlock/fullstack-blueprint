version: 1
disable_existing_loggers: false

formatters:
  default:
    format: "[%(asctime)s] [%(levelname)s] %(name)s:%(lineno)d: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  debug:
    format: "[%(asctime)s] [%(levelname)s] [pid=%(process)d thread=%(threadName)s] %(name)s:%(lineno)d %(funcName)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  access:
    "()": uvicorn.logging.AccessFormatter
    fmt: '[%(asctime)s] %(levelprefix)s %(client_addr)s - "%(request_line)s" %(status_code)s'
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  default:
    class: logging.StreamHandler
    formatter: default
    level: INFO
    stream: ext://sys.stdout

  debug:
    class: logging.StreamHandler
    formatter: debug
    level: DEBUG
    stream: ext://sys.stdout

  access:
    class: logging.StreamHandler
    formatter: access
    level: INFO
    stream: ext://sys.stdout

loggers:
  src:
    level: INFO
    handlers: [default]
    propagate: false

  uvicorn.error:
    level: INFO
    handlers: [default]
    propagate: false

  uvicorn.access:
    level: INFO
    handlers: [access]
    propagate: false

  httpx:
    level: WARNING
    handlers: [default]
    propagate: false

root:
  level: INFO
  handlers: [default]
